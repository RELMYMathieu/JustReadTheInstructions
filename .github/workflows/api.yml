name: api

on:
  push:
    branches: [main]
    paths:
      - Source/**
      - Tests/**
      - Tools/**
      - docs/openapi.json
      - .github/workflows/api.yml
  pull_request:
    paths:
      - Source/**
      - Tests/**
      - Tools/**
      - docs/openapi.json
      - .github/workflows/api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests, including the published OpenAPI document
        run: dotnet test Tests/JRTI.Tests

      - name: Mock server answers every API route
        run: node Tools/check-routes.mjs

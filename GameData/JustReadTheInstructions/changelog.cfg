KERBALCHANGELOG
{
    showChangelog = True
    modName = Just Read The Instructions
    license = MIT
    author = Mathieu Relmy

    VERSION
    {
        version = 2.4.1.1
        CHANGE
        {
            change = Added
            subchange = Performance overlay (Ctrl+Alt+F7 in flight, or Settings > Diagnostics) - game FPS and frame time, JRTI's own cost per frame, memory and garbage collections, plus per-camera render and stream stats. Can log to CSV (PluginData/PerfLogs/), and the latest sample is served as JSON at /debug/stats
            subchange = Diagnostics page in the web UI (gauge button, or /debug.html) - the same numbers live, with the last two minutes charted and values needing attention highlighted
            subchange = "Spread camera renders across frames" setting (on by default) - cameras take turns rendering instead of all on the same frame, evening out frame times with several cameras open or streaming
            subchange = Camera layout page in the web UI (grid button, or /layout.html) - watch several cameras in one window, with Spotlight (one large tile), Fullscreen and Fill (edge to edge split screens). Layouts are saved by camera name and can be shared as a link (layout.html?cams=10,11,12), handy as a single OBS browser source
            subchange = All cameras of a layout stream over one connection (/streams?ids=1,2,3), so large layouts no longer hit the browser's limit of 6 connections per host
            subchange = In-game recording, now the default - the Record button records an MP4 inside the game with the graphics card's encoder (Media Foundation on Windows, ffmpeg on Linux and macOS). Steady frame rate, keeps recording when the web page is closed, stays playable if the game crashes and scrubs cleanly in every player
            subchange = "Video codec" option in the web UI's recorder settings - H.264 stays the default, AV1 is available on Linux and macOS when ffmpeg has an AV1 encoder (not on Windows yet). See the README's "Recording & Codecs" section
            subchange = The browser recorder stays as a fallback when in-game recording can't start, and can still be picked in "Record with" (for example to save to another device). In-game recording can be turned off in the settings window
        }
        CHANGE
        {
            change = Changed
            subchange = Every camera now renders at most Max FPS times per second, whether it has an in-game window, a stream, or both, instead of every (other) game frame. Streamed cameras only render when the stream needs a new frame. Camera windows used to render at half the game's frame rate (72 FPS on a 144 FPS game), so this is much lighter at high frame rates. Max FPS is now correctly labeled "camera windows and streams" since it applies to both respectively.
            subchange = Much less memory churn while streaming, which should reduce stutter. Each camera reuses its frame buffers instead of allocating a new one per frame (about 2.7 MB per frame at 720p), and per-render camera lookups no longer allocate
            subchange = At most two frames per camera are read back and encoded at once, so JPEG encoding can no longer pile up behind a slow CPU, while a slow readback or encode no longer lowers the stream's frame rate
            subchange = OpenGL (no async readback) no longer uploads every captured frame back to the GPU
            subchange = Stream captures now land on the game frame closest to when they are due instead of the first frame after, so a stream's frame spacing stays even when the game runs at about a multiple of Max FPS
            subchange = The main page's live card previews (shown for cameras someone is watching) now share one connection instead of opening one each, so the main page open next to a layout page or several viewers no longer runs into the browser's limit of 6 (or whatever the browser limits it to) connections per host
        }
        CHANGE
        {
            change = Deprecated
            subchange = The browser recorder (MediaRecorder in the web page, uploaded in chunks) is now the legacy recorder, shown as "legacy" in the web UI. It will be removed in v3.0.0 along with its upload endpoints and the MP4/WebM fixers, as the in-game recorder is a much better solution and is much easier to maintain and debug.
        }
        CHANGE
        {
            change = Removed
            subchange = Render camera windows every other frame setting has been replaced by the Max FPS setting which applies to both camera windows in game and in the streamer Web UI.
        }
        CHANGE
        {
            change = Fixed
            subchange = When the web UI's port is taken by another program, JRTI now says so on screen and in the settings window next to the Port field, instead of only writing it to KSP.log.
            subchange = Streamed cameras now properly pace their frames attempting to hover towards the "Max framerate" option when being watched, which makes the viewing experience a lot smoother.
            subchange = Camera feeds recover on their own after closing the map view. Opening the map switches KSP's cameras and visual mods like Scatterer and EVE to map mode, and JRTI cameras kept the broken rendering until they were closed and reopened. They are now rebuilt half a second after the map closes, without interrupting streams, viewers or recordings (may cause a very brief freeze or lag spike to cameras that are rendering)
            subchange = Recordings no longer get stuck on "Saving..." or keep showing as recording after the game has already saved them. When the server closes a recording on its own (no data for 30 seconds), the web UI now notices and returns to idle instead of sending requests that keep failing, and saving gives up waiting after 15 seconds and leaves the file to the server
            subchange = Recording heartbeats now use their own endpoint and no longer pile up while the connection is slow
            subchange = A recording's camera stream now reconnects on its own when it ends (for example when the camera is closed and reopened in game), so a recording paused on signal loss records live frames again when it resumes instead of a frozen image
        }
    }

    VERSION
    {
        version = 2.4.1
        CHANGE
        {
            change = Fixed
            subchange = Cameras sharing the same part (e.g. Starship Expansion Project's booster and ship parts) now work independently; opening or streaming one camera no longer marks every camera on that part as open/streaming. A custom ID set on such a part now numbers its cameras in order (ID 10 gives 10, 11, 12...), and a custom name is suffixed with each camera's own name (thanks to Recoleto for bringing this to my attention)
            subchange = The plugin DLL's assembly version now matches the release; it had been left at 2.3.0.0 since v2.3.0, so tools reading the DLL version reported the wrong release
        }
    }

    VERSION
    {
        version = 2.4.0
        CHANGE
        {
            change = Added
            subchange = Features from v2.3.0.1 deemed stable, and now added to stable version
            subchange = Merged PR#25 (restore OpenGL far-PQS camera rendering- #25); many thanks to ruedigerlenz for contributing!
        }
    }

    VERSION
    {
        version = 2.3.0.1
        CHANGE
        {
            change = Added
            subchange = (Experimental) Scatterer sun flare now renders through JRTI cameras - the per-camera sun flare hook is mirrored onto our cameras via reflection so the flare stops being culled on the JRTI feed. Requires Scatterer integration enabled. This beta is lightly tested - please report flares that fail to appear at some sun angles, look misplaced, or affect the main view
        }
        CHANGE
        {
            change = Fixed
            subchange = Night-vision camera mode no longer brightens the main game view - the night-vision filter cloned onto JRTI cameras was forcing the scene-global ambient light high every frame, which bled onto the main camera; the boost is now confined to the JRTI camera's own render pass. Builds on andredichev's fix for the same issue
        }
    }

    VERSION
    {
        version = 2.3.0
        CHANGE
        {
            change = Added
            subchange = (Experimental) Option to disable the web streaming server entirely - run JRTI with in-game camera windows only, no HTTP server, browser streaming, or recording. Lighter on low-end machines. Toggle in Settings > Stream / Capture, or set EnableStreamServer in settings.cfg. Takes effect on next flight scene entry
            subchange = Per-camera brightness, contrast, and gamma controls in the web viewer - adjustments are applied server-side so all viewers on the local network see the same image
            subchange = Per-camera FOV control in the web viewer (shown when the camera reports a valid FOV range from KSP)
        }
        CHANGE
        {
            change = Changed
            subchange = In-game UI polish pass - more spacious layouts, larger text, roomier buttons and camera controls
        }
        CHANGE
        {
            change = Fixed
            subchange = Camera IDs are now scoped to a flight session and freed when a craft is recovered or unloaded - relaunching a craft reliably restores its chosen IDs instead of them being bumped because a now-gone craft still held the number
            subchange = The web server no longer reaches into live in-game camera state from its request threads, removing a rare race that could surface as a crash near the web UI
            subchange = Two memory structures (the runtime camera-ID map and the finalized-recording set) no longer grow unbounded over a long session
            subchange = Camera windows now cascade on screen when opened instead of all stacking in the bottom-right corner
            subchange = Camera windows now open in full UI mode by default - minimal mode (preview only) can be enabled in settings or toggled per-window with a double-click
            subchange = Double-clicking the camera preview to toggle minimal mode now correctly resizes the window immediately (used to bug out and not properly resize until the next manual resize from the user)
        }
    }

    VERSION
    {
        version = 2.2.0.1
        CHANGE
        {
            change = Added
            subchange = Cameras can now be named & given a unique ID via the right-click part menu in the VAB - stored in the craft file, no external config needed
        }
        CHANGE
        {
            change = Fixed
            subchange = Opening more than 4 viewer tabs no longer stalls - the status poll in the viewer now only starts after signal loss, eliminating the persistent per-tab connection that was saturating the browser's HTTP/1.1 connection pool
            subchange = WebM VINT encoding bitwise-or on sign-extended operand
        }
    }

